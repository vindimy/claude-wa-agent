# WhatsApp group digest agent — Docker / service profile. See docs/deploy.md.
#
# Runs the prebuilt image from GitHub Container Registry. To build locally
# instead:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Never run this against the same data/ directory as a host (pm2/launchd)
# instance: one linked session per tenant auth directory.
services:
  digest:
    image: ghcr.io/vindimy/claude-wa-agent:${DIGEST_IMAGE_TAG:-latest}
    container_name: wa-digest
    restart: unless-stopped
    init: true
    # Long enough for the outbox to finish an in-flight send.
    stop_grace_period: 20s
    # Match the host user that owns ./data and ./vault (id -u / id -g).
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      # Fallback time zone for cadences without an explicit tz.
      TZ: ${TZ:-UTC}
      # The dashboard (off unless DASHBOARD_PORT is set in .env) must bind to
      # all interfaces inside the container; `ports:` below keeps it on the
      # VPS loopback.
      DASHBOARD_HOST: 0.0.0.0
    # Uncomment to reach the dashboard through an SSH tunnel:
    #   ssh -L 8787:127.0.0.1:8787 vps   →   http://127.0.0.1:8787
    # ports:
    #   - "127.0.0.1:${DASHBOARD_PORT:-8787}:${DASHBOARD_PORT:-8787}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./vault:/app/vault
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
