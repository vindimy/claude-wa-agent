# WhatsApp group digest agent — Docker / service profile.
# See docs/deploy.md. Never run this against the same data/ directory as a
# host (pm2/launchd) instance: one linked session per tenant auth directory.
services:
  digest:
    build: .
    image: wa-digest-agent:local
    container_name: wa-digest
    restart: unless-stopped
    init: true
    # Long enough for the outbox to finish an in-flight send.
    stop_grace_period: 20s
    env_file: .env
    environment:
      # Fallback time zone for cadences without an explicit tz.
      TZ: ${TZ:-UTC}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./vault:/app/vault
    # The container runs as uid 1000 (node). If ./data is owned by another
    # user on the host, either chown it or set `user: "${UID}:${GID}"` here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
