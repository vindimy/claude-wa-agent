# Copy to config.yaml and edit. config.yaml is gitignored.
#
# Only groups listed under `groups:` are ingested. Everything else is ignored.
# Find group JIDs by running `pnpm digest run` once (paired) and then
# `pnpm digest groups` — it lists every group the account participates in.

defaults:
  summarizer: cli-claude
  cadence: { type: daily, at: "08:00", tz: "America/Los_Angeles" }
  deliver: { self_dm: true, group: false, vault: true }
  summary:
    language: auto          # auto | ru | en
    style: topics           # topics | narrative | action-items
    max_words: 300

# Per-adapter options, keyed by adapter name. All keys optional.
# Override the adapter for every group at runtime with SUMMARIZER=api-anthropic
# (used by the Docker profile when CLI auth is not available).
summarizers:
  cli-claude:
    model: sonnet         # alias or full model id; omit for the CLI's default
    timeout_seconds: 180
    # bin: /usr/local/bin/claude
  api-anthropic:          # needs ANTHROPIC_API_KEY in the environment
    model: claude-opus-5  # any current model id; claude-sonnet-5 is cheaper
    timeout_seconds: 180

# Markdown notes vault. One note per summary: <dir>/<group-slug>/<date>-<id>.md
# Override at runtime with VAULT_DIR.
vault:
  dir: ./vault

# How long raw messages are kept. Summaries, run records, and vault notes are
# kept regardless. Allowed: 30, 60, 90, 180.
retention:
  days: 30

limits:
  max_sends_per_day: 30           # WhatsApp sends per tenant in any rolling 24 h
  min_group_post_gap_minutes: 60  # spacing between two posts into the same group

ingest:
  media: false

groups:
  - jid: "120363000000000001@g.us"
    name: "Example group"
    cadence: { type: threshold, messages: 150, max_hours: 24 }
    # Post scheduled digests back into this group, signed "🤖 Auto-digest".
    # Must be set per group; `defaults.deliver.group: true` is rejected.
    # deliver: { group: true }
  - jid: "120363000000000002@g.us"
    name: "Family"
    cadence: { type: weekly, day: sun, at: "18:00" }
    summary: { language: ru }
